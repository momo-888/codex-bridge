plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def releaseKeystorePath = System.getenv("CODEX_BRIDGE_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("CODEX_BRIDGE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CODEX_BRIDGE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CODEX_BRIDGE_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "com.codexbridge.mobile"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.codexbridge.mobile"
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName "0.6.4"
        def configuredBridgeUrl = project.findProperty("bridgeUrl") ?: ""
        buildConfigField "String", "DEFAULT_BRIDGE_URL", '"' + configuredBridgeUrl + '"'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    def composeBom = platform("androidx.compose:compose-bom:2025.04.01")
    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "me.saket.telephoto:zoomable-image-coil:0.19.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
